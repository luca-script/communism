name: Run Checks

on:
  push:
    branches: [ "master", "staging", "experimental" ]
  pull_request:
    branches: [ "master", "staging", "experimental" ]

permissions:
  contents: read

jobs:
  format:
    name: PHP-CS-Fixer
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code formatting
        run: composer run-script format:check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer run-script analyse -- --no-progress

  coverage:
    name: "Test coverage (${{ matrix.os.name }})"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            id: ubuntu-26.04
          - name: Windows
            id: windows-2025

    runs-on: ${{ matrix.os.id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring, pcov
          ini-values: ffi.enable=true
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Zendful coverage with crash diagnostics (Linux)
        if: matrix.os.name == 'Linux'
        shell: bash
        run: bash tools/crash-diagnostics/run.sh coverage.php zendful

      - name: Run Zendful coverage with crash diagnostics (Windows)
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: ./tools/crash-diagnostics/run.ps1 coverage.php zendful

      - name: Run Communism coverage with crash diagnostics (Linux)
        if: matrix.os.name == 'Linux'
        shell: bash
        run: bash tools/crash-diagnostics/run.sh coverage.php communism

      - name: Run Communism coverage with crash diagnostics (Windows)
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: ./tools/crash-diagnostics/run.ps1 coverage.php communism
